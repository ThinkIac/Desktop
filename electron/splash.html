<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'">
  <title>ThinkIac</title>
  <style>
    @font-face {
      font-family: Ubuntu;
      src: url('ubuntu-greek-500-normal.woff2') format('woff2');
      font-weight: 500;
      font-display: swap;
    }
    [data-theme="dark"] {
      --tk-bg: #111111;
      --tk-text: #f5f5f5;
      --tk-font: Ubuntu, system-ui, sans-serif;
    }
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--tk-text);
      background: var(--tk-bg);
    }
    .sigma {
      display: grid;
      overflow: hidden;
      font: 500 clamp(88px, 19vmin, 144px)/1 var(--tk-font);
    }
    .glyph { grid-area: 1 / 1; }
    .track { opacity: .2; }
    .mask {
      overflow: hidden;
      animation: fill-up 1800ms ease-in-out infinite alternate;
    }
    .fill {
      display: block;
      animation: keep-glyph 1800ms ease-in-out infinite alternate;
    }
    @keyframes fill-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0%); }
    }
    @keyframes keep-glyph {
      from { transform: translateY(-100%); }
      to { transform: translateY(0%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mask, .fill { animation: none; }
    }
  </style>
</head>
<body>
  <div class="sigma" role="status" aria-label="Carregando ThinkIac">
    <span class="glyph track" aria-hidden="true">Σ</span>
    <span class="glyph mask" aria-hidden="true"><span class="fill">Σ</span></span>
  </div>
</body>
</html>
