<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ThinkIac</title><style>
html,body{width:100%;height:100%;margin:0;background:#000}body{display:grid;place-items:center;overflow:hidden}.sigma-loader{display:grid;place-items:center;width:136px;height:136px;animation:sigma-fade 1800ms linear infinite}.glyph{grid-area:1/1;font:600 136px/1 Ubuntu,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.08em}.track{color:#fff;opacity:.2}.fill{color:#fff;animation:sigma-fill 1800ms linear infinite}@keyframes sigma-fade{0%{opacity:0}8%,78%{opacity:1}100%{opacity:0}}@keyframes sigma-fill{0%{clip-path:inset(100% 0 0 0)}72%,100%{clip-path:inset(0 0 0 0)}}@media (prefers-reduced-motion:reduce){.sigma-loader{animation:sigma-pulse 2400ms ease-in-out infinite}.fill{animation:none}.track{opacity:0}@keyframes sigma-pulse{0%,100%{opacity:.45}50%{opacity:1}}}
</style></head><body><div class="sigma-loader" role="status" aria-label="Carregando"><span class="glyph track" aria-hidden="true">Σ</span><span class="glyph fill" aria-hidden="true">Σ</span></div></body></html>
