<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ThinkIac</title><style>
html,body{width:100%;height:100%;margin:0;background:#000}body{display:grid;place-items:center;overflow:hidden;color:#fff;font:400 14px/1.4 Ubuntu,-apple-system,"Segoe UI",sans-serif}.splash{display:grid;place-items:center;gap:24px}.sigma-loader{display:grid;place-items:center;width:144px;height:144px;animation:sigma-fade 1800ms linear infinite}.glyph{grid-area:1/1;font:600 144px/1 Ubuntu,-apple-system,"Segoe UI",sans-serif}.track{color:#fff;opacity:.18}.fill{color:#fff;animation:sigma-wave-fill 1800ms linear infinite}@keyframes sigma-fade{0%{opacity:0}8%,78%{opacity:1}100%{opacity:0}}@keyframes sigma-wave-fill{0%{clip-path:polygon(0 100%,0 108%,18% 103%,38% 108%,58% 103%,78% 108%,100% 103%,100% 100%)}72%,100%{clip-path:polygon(0 0,0 8%,18% 3%,38% 8%,58% 3%,78% 8%,100% 3%,100% 0)}}.failure{display:none;max-width:340px;text-align:center}.failure p{margin:0 0 16px;color:#c8c8c8}.failure button{border:1px solid rgba(255,255,255,.2);border-radius:8px;background:#fff;color:#111;padding:8px 14px;font:500 14px/1 Ubuntu,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.failure button:hover{opacity:.86}.failed .sigma-loader{display:none}.failed .failure{display:block}@media (prefers-reduced-motion:reduce){.sigma-loader{animation:sigma-pulse 2400ms ease-in-out infinite}.fill{animation:none;clip-path:none}.track{opacity:0}@keyframes sigma-pulse{0%,100%{opacity:.45}50%{opacity:1}}}
</style></head><body><main class="splash"><div class="sigma-loader" role="status" aria-label="Carregando"><span class="glyph track" aria-hidden="true">Σ</span><span class="glyph fill" aria-hidden="true">Σ</span></div><section class="failure" aria-live="assertive"><p></p><button type="button">Tentar novamente</button></section></main><script>const splash=document.querySelector('.splash'),message=document.querySelector('.failure p');window.runtime.onFailure((error)=>{message.textContent=error;splash.classList.add('failed')});document.querySelector('button').addEventListener('click',()=>{splash.classList.remove('failed');window.runtime.retry()})</script></body></html>
