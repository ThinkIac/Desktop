name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm version 1.0.0-ci.${{ github.run_number }} --no-git-tag-version
      - run: node scripts/prepare-runtime-bundle.mjs runtime-bundle
      - run: npm run build:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-main-${{ github.sha }}
          name: ThinkIac Desktop ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.exe
